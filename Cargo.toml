[package]
name = "openjersey"
version = "0.1.0"
edition = "2024"
description = "Volleyball jersey designer: 3D model, print template and sublimation layout"
license = "GPL-3.0-or-later"
repository = "https://github.com/GodGotzi/openjersey"
readme = "README.md"

[dependencies]
ab_glyph = "0.2"
base64 = "0.22"
getrandom = "0.3"
gltf = "1.4"
image = "0.25.10"
myth-engine = { version = "=0.3.0", features = ["egui"] }
resvg = "0.49"
rfd = "0.17.2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
softbuffer = "0.4"
tiny-skia = "0.12"
toml = "1"
winit = "0.30.13"

[build-dependencies]
serde_json = "1"
toml = "1"
